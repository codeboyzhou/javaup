baseURL: https://codeboyzhou.github.io/javaup/
title: javaup documentation
theme: hugo-geekdoc

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
disablePathToLower: true
enableRobotsTXT: true
pluralizeListTitles: false

languages:
  en:
    locale: en-US
    label: English
    contentDir: content/en
    title: javaup documentation
    weight: 1
    params:
      geekdocSubtitle: Project-Aware Java Toolchains for Maven Builds
  zh-cn:
    locale: zh-CN
    label: 简体中文
    contentDir: content/zh-cn
    title: javaup 项目文档
    weight: 2
    params:
      geekdocSubtitle: 面向 Maven 项目的 Java 工具链管理器

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6

outputs:
  home:
    - HTML
  page:
    - HTML
  section:
    - HTML

params:
  geekdocSubtitle: Project-Aware Java Toolchains for Maven Builds
  geekdocRepo: https://github.com/codeboyzhou/javaup
  geekdocEditPath: edit/main/docs
  geekdocCollapseAllSections: false
  geekdocBreadcrumb: true
  geekdocNextPrev: true
  geekdocSearch: true
  geekdocSearchShowParent: true
  geekdocDarkModeToggle: true
  geekdocBackToTop: true
  geekdocOverwriteHTMLBase: true
  geekdocToC: 4

minify:
  disableHTML: true
